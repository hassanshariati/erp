# Prefer AWS Public ECR over Docker Hub where the VPS receives HTTP 403.
# Images are pinned to major/minor tags; pin digests after acceptance testing.
services:
  db:
    image: public.ecr.aws/docker/library/mariadb:11.8
    pull_policy: missing
  redis-cache:
    image: public.ecr.aws/docker/library/redis:7-alpine
    pull_policy: missing
  redis-queue:
    image: public.ecr.aws/docker/library/redis:7-alpine
    pull_policy: missing
  caddy:
    image: public.ecr.aws/docker/library/caddy:2.10.2-alpine
    pull_policy: missing
