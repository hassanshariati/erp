name: ERP Graphify (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment repository without ERPNext submodule
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build code-only graph
        env:
          GRAPHIFY_BACKEND: none
          GRAPHIFY_QUERY_LOG_DISABLE: '1'
        run: bash scripts/graphify.sh

      - name: Upload graph for inspection
        uses: actions/upload-artifact@v4
        with:
          name: erp-graphify
          if-no-files-found: error
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
