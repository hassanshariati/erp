name: Deploy ERPNext
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy.yml"
permissions:
  contents: read
concurrency:
  group: erpnext-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, erpnext-deploy]
    environment: production
    timeout-minutes: 45
    steps:
      - name: Deploy checked out revision
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: /opt/erp/deploy/scripts/ci-deploy.sh "$DEPLOY_SHA"
