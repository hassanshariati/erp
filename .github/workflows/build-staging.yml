# Fail-closed rule: production runs only after a fully passing disposable install,
# and requires the root-owned on-host wrapper to be byte-for-byte identical to
# the reviewed source committed in this workflow revision.
name: Build and deploy ERPNext with Wiki (no Helpdesk or Telephony)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-staging.yml"
      - "deploy/Dockerfile"
      - "deploy/compose*.yaml"
      - "deploy/scripts/**"
      - "apps/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: erpnext-wiki-release
  cancel-in-progress: true

jobs:
  integration:
    name: Build image and install on disposable Docker site
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Configure disposable stack
        shell: bash
        run: |
          set -Eeuo pipefail
          cd deploy
          umask 077
          mkdir -p secrets backups
          openssl rand -base64 48 > secrets/db_root_password
          openssl rand -base64 48 > secrets/admin_password
          cat > .env <<'ENV'
          ERPNEXT_VERSION=v16.53.0
          COMPOSE_PROJECT_NAME=erpci
          CUSTOM_IMAGE=erpci/erpnext
          CUSTOM_TAG=staging
          PULL_POLICY=never
          SITE_NAME=staging.local
          HOST_HTTP_PORT=18080
          ENV

      - name: Build ERPNext image with Wiki but without Telephony
        run: |
          set -Eeuo pipefail
          docker build --progress=plain --build-arg ERPNEXT_VERSION=v16.53.0 -t erpci/erpnext:staging -f deploy/Dockerfile .

      - name: Verify Wiki-only image
        run: bash deploy/scripts/verify-image.sh

      - name: Verify installed apps on disposable site
        run: |
          set -Eeuo pipefail
          cd deploy
          CONFIRM_INITIALIZE=YES bash scripts/initialize.sh
          bash scripts/smoke-site.sh

      - name: Publish tested image to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          image="ghcr.io/hassanshariati/erp:apps-${GITHUB_SHA}"
          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag erpci/erpnext:staging "$image"
          docker push "$image"
          docker logout ghcr.io

      - name: Report current state on failure
        if: failure()
        shell: bash
        run: |
          cd deploy
          docker compose -f compose.yaml -f compose.production.yaml ps -a || true
          docker compose -f compose.yaml -f compose.production.yaml logs --tail=75 db backend configurator || true

  production:
    name: Upgrade existing armember.ir with Wiki (restricted wrapper)
    needs: integration
    # Disabled while six-app image is being integrated. Re-enable only after
    # successful disposable-site test and root-owned production wrapper review.
    if: github.ref == 'refs/heads/main' && github.actor == 'hassanshariati'
    runs-on: [self-hosted, linux, x64, erpnext-deploy]
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout reviewed release scripts
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Verify root-controlled server deployment wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x /usr/local/sbin/erpnext-gha-release || {
            echo "One-time server bootstrap required: sudo bash /opt/erp/deploy/scripts/bootstrap-gha-release.sh" >&2
            exit 1
          }
          sudo -n -l >/dev/null
          # Refuse a stale root-owned helper: the current release must explicitly
          # install Wiki while excluding Helpdesk and Telephony.
          if ! cmp -s /usr/local/sbin/erpnext-gha-release deploy/scripts/upgrade-existing-production.sh; then
            echo "Server wrapper is out of date. Update it from the reviewed repository and run the root-only bootstrap script." >&2
            exit 1
          fi

      - name: Verify production login and login theme assets
        shell: bash
        run: |
          set -Eeuo pipefail
          login_html="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://armember.ir/login)"
          for marker in 'id="page-login"' 'id="login_email"' 'id="login_password"' 'login-theme.css'; do
            [[ "$login_html" == *"$marker"* ]] || {
              echo "Production login page is missing: $marker" >&2
              exit 1
            }
          done
          css="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://armember.ir/assets/bisness_core/css/login-theme.css)"
          [[ "$css" == *'#page-login'* ]] || { echo "Production login CSS not served" >&2; exit 1; }
          svg="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 15 https://armember.ir/assets/bisness_core/images/login-visual.svg)"
          [[ "$svg" == *'<svg'* ]] || { echo "Production login artwork not served" >&2; exit 1; }
          echo "Production native login form and theme assets are healthy."

      - name: Install reviewed apps onto the existing ERPNext site
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ghcr.io/hassanshariati/erp:apps-${{ github.sha }}
        run: |
          set -Eeuo pipefail
          printf '%s\n' "$GHCR_TOKEN" | sudo -n /usr/local/sbin/erpnext-gha-release "$RELEASE_IMAGE"
